<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { copied: false, now: Date.now() };
  componentDidMount() { this.tick = setInterval(() => this.setState({ now: Date.now() }), 15000); }
  componentWillUnmount() { clearTimeout(this.ct); clearInterval(this.tick); }
  renderVals() {
    const localTime = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).format(this.state.now);
    return {
      localTime,
      copiedOpacity: this.state.copied ? 1 : 0,
      copy: e => {
        e.preventDefault();
        if (navigator.clipboard) navigator.clipboard.writeText('vipatr02@gmail.com').catch(() => {});
        this.setState({ copied: true });
        clearTimeout(this.ct);
        this.ct = setTimeout(() => this.setState({ copied: false }), 1600);
      }
    };
  }
}
