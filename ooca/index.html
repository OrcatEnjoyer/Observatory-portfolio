<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Thought Deconstruct</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Point these at your actual licensed Gotham Rounded files */
@font-face{
  font-family:'Gotham Rounded';
  src: url('assets/fonts/GothamRounded-Book.otf') format('opentype');
  font-weight:400;
}
@font-face{
  font-family:'Gotham Rounded';
  src: url('assets/fonts/GothamRounded-Medium.otf') format('opentype');
  font-weight:500;
}
@font-face{
  font-family:'Gotham Rounded';
  src: url('assets/fonts/GothamRounded-Bold.otf') format('opentype');
  font-weight:700;
}

:root{
  --turquoise-1:#00C4B3;
  --turquoise-2:#B3EDE8;
  --turquoise-3:#DBF0EE;
  --turquoise-text:#009688;
  --blue-1:#1F77DF;
  --blue-4:#C7DDF7;
  --marigo-1:#F9A000;
  --marigo-2:#F8E4B3;
  --gray-900:#2B2B2B;
  --gray-700:#528984;
  --gray-400:#C4C4C4;
  --gray-200:#F1F1F1;
  --gray-100:#F6F6F6;
  --white:#FFFFFF;
  --font-display:'Gotham Rounded', system-ui, sans-serif;
  --font-body:'Gotham Rounded', system-ui, sans-serif;
  --font-hand:'Caveat','Segoe Script',cursive;
}

@font-face{
  font-family:'Baloo 2';
  src:local('Baloo 2');
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%;
  font-family:var(--font-body);
  background:var(--gray-100);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
#app{
  position:relative;
  width:100vw; height:100vh; height:100dvh;
  overflow:hidden;
}

.screen{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  opacity:0; pointer-events:none;
  transition:opacity 900ms ease;
  padding:24px;
  text-align:center;
}
.screen.active{ opacity:1; pointer-events:auto; }

.eyebrow{
  font-family:var(--font-body);
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gray-700);
  margin-bottom:10px;
}
.logo-mark{
  font-family:var(--font-display);
  font-weight:800;
  font-size:15px;
  letter-spacing:-0.01em;
  text-transform:none;
  color:var(--turquoise-1);
  position:relative;
}
.logo-mark .lm-heart{
  color:var(--blue-1);
  font-size:10px;
  position:relative;
  top:-6px;
}

.logo-mark-img{
  height:15px;
  width:auto;
  margin-bottom:10px;
}

h1.prompt{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(22px,4.4vw,34px);
  color:var(--gray-900);
  max-width:560px;
  margin:0 0 28px 0;
  line-height:1.35;
}
.btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:16px;
  padding:14px 30px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:var(--turquoise-1);
  color:var(--white);
  box-shadow:0 8px 16px 0 rgba(0,196,179,.16);
  transition:transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
}
.btn:hover{ background:#00af9a; transform:translateY(-1px); }
.btn:active{ transform:translateY(0px) scale(.98); }
.btn:focus-visible{ outline:3px solid var(--blue-1); outline-offset:3px; }
.btn.secondary{
  background:transparent;
  color:var(--turquoise-text);
  box-shadow:none;
  border:1.5px solid var(--turquoise-2);
}
.btn.secondary:hover{ background:var(--turquoise-3); }

.mooca{ width:92px; height:auto; margin-bottom:18px; filter:drop-shadow(0 10px 14px rgba(0,0,0,.06)); }


#mini-mooca{
  position:absolute; left:26px; bottom:28px; width:56px; height:auto;
  z-index:15; opacity:.9;
  animation:mini-float 6s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.08));
}
@keyframes mini-float{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-8px) rotate(-2deg); }
}
#mini-mooca{
  position:absolute; left:26px; bottom:28px; width:56px; height:56px;
  z-index:15; opacity:.9;
  animation:mini-float 6s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.08));
  
}.mini-mood{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain;
  opacity:0;
  transition:opacity 1.2s ease;
}
.mini-mood.active{ opacity:1; }
#mini-mooca.blink .eye-cover{ transform:scaleY(1); }
#mini-mooca .mini-cloud{ transition:fill 1.2s ease; }
#mini-brow-l, #mini-brow-r{ transition:opacity 1.2s ease; }

#dev-timer{
  position:fixed; top:14px; left:16px; z-index:999;
  font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--turquoise-text);
  background:var(--white); border:1.5px solid var(--turquoise-2);
  padding:5px 12px; border-radius:999px;
  letter-spacing:.02em; pointer-events:none; opacity:0; transition:opacity 400ms ease;
}
#dev-timer.show{ opacity:1; }

#screen-entry{ background:linear-gradient(180deg,var(--turquoise-3) 0%, var(--gray-100) 78%); }
.entry-sub{ font-size:15px; color:var(--gray-700); max-width:320px; margin:-14px 0 26px; }

#screen-input{ background:var(--gray-100); }
.chip-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:520px; margin-bottom:22px; }
.chip{
  font-size:14px; font-family:var(--font-body);
  padding:9px 16px; border-radius:999px;
  background:var(--white); border:1.5px solid var(--gray-200);
  color:var(--gray-900); cursor:pointer;
  transition:border-color 150ms ease, background 150ms ease;
}
.chip:hover{ border-color:var(--turquoise-2); background:var(--turquoise-3); }
.thought-input{
  width:min(520px,86vw);
  font-family:var(--font-body);
  font-size:17px;
  padding:16px 20px;
  border-radius:16px;
  border:1.5px solid var(--gray-200);
  background:var(--white);
  margin-bottom:22px;
  text-align:center;
  outline:none;
}
.thought-input:focus{ border-color:var(--turquoise-1); box-shadow:0 0 0 4px var(--turquoise-3); }

#screen-experience{
  background-color: var(--gray-100);
  background-image:
    var(--experience-bg, radial-gradient(120% 120% at 50% 40%, #ffffff 0%, #F6F6F6 60%)),
    radial-gradient(rgba(217,217,217,var(--dot-alpha,0)) 1px, transparent 1px);
  background-size: 100% 100%, 22px 22px;
  background-position: 0 0, 0 0;
  transition:background-image 200ms linear;
  touch-action:none;
  justify-content:flex-start;
  -webkit-user-select:none;
  -moz-user-select:none;
  user-select:none;
}
#world{
  position:relative;
  z-index:10;
  width:100%; height:100%;
  perspective:1200px;
  transform-origin:center center;
}
#screen-experience.pannable{ cursor:grab; }
#screen-experience.panning{ cursor:grabbing; }
#thought-wrap{
  position:absolute;
  left:50%; top:46%;
  transform:translate(-50%,-50%);
  will-change:transform;
  display:flex; flex-direction:column; align-items:center;
  z-index:9;
  transition:opacity 100ms linear;
}
#thought-card-inner{
  display:flex; flex-direction:column; align-items:center;
}
#reframe-text{
  font-family:var(--font-body);
  font-weight:600;
  font-size:clamp(24px,5vw,40px);
  color:var(--gray-900);
  opacity:0;
  margin-bottom:6px;
  white-space:nowrap;
}
#thought-text{
  font-family:var(--font-body);
  font-weight:800;
  font-size:clamp(56px,15vw,240px);
  line-height:1.02;
  letter-spacing:-0.01em;
  color:var(--gray-900);
  max-width:92vw;
  text-align:center;
}
#thought-text.noticing{ animation:notice-breathe 1.7s ease-in-out infinite; }
@keyframes notice-breathe{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.045); }
}

.fog-layer{
  position:absolute; inset:-15%; z-index:8; pointer-events:none;
  background: radial-gradient(circle at var(--fx,50%) var(--fy,50%),
    rgba(200,200,200,.15) 0%,
    rgba(140,140,140,.35) 42%,
    rgba(90,90,90,.55) 72%,
    rgba(60,60,60,.7) 100%);
  mix-blend-mode:multiply;
  opacity:1;
  filter:blur(0px);
  transform:scale(1) rotate(var(--r,0deg)) translate(0,0);
  transition:opacity 6s ease, transform 6s cubic-bezier(.3,0,.6,1), filter 6s ease;
}
#fog-1{ --fx:50%; --fy:50%; --r:0deg; }
#fog-2{ --fx:42%; --fy:58%; --r:6deg; transform:scale(1.08) rotate(6deg); opacity:.7; }
#fog-3{ --fx:58%; --fy:40%; --r:-8deg; transform:scale(1.16) rotate(-8deg); opacity:.5; }

#fog-1.lifted{ opacity:0; filter:blur(18px); transform:scale(1.5) rotate(4deg) translate(-14%,-10%); }
#fog-2.lifted{ opacity:0; filter:blur(18px); transform:scale(1.55) rotate(14deg) translate(16%,-14%); }
#fog-3.lifted{ opacity:0; filter:blur(18px); transform:scale(1.6) rotate(-18deg) translate(4%,18%); }
.fragment{
  position:absolute;
  z-index:9;
  opacity:0;
  will-change:transform,opacity;
  pointer-events:none;
}
.card{
  font-family:var(--font-hand);
  font-size:15px;
  color:var(--gray-900);
  background:var(--white);
  border-radius:8px;
  padding:10px 14px;
  box-shadow:0 8px 16px 0 rgba(0,0,0,.08);
  width:150px;
  text-align:center;
}
.card.tone-turq{ background:var(--turquoise-3); }
.card.tone-marigo{ background:var(--marigo-2); }
.card.tone-blue{ background:var(--blue-4); }

.card.type-bubble{ font-family:var(--font-body); font-size:14px; border-radius:16px; }
.card.type-reframe{ width:190px; }
.reframe-prefix{ font-family:var(--font-body); font-size:11px; color:var(--gray-900); margin-bottom:4px; }.reframe-main{ font-family:var(--font-body); font-weight:700; }

.card.type-sticky{
  width:118px; padding:16px 12px 12px; background:var(--marigo-2);
  border-radius:2px; position:relative; font-family:var(--font-hand); font-size:14px;
}
.sticky-tape{
  position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-3deg);
  width:36px; height:15px; background:rgba(255,255,255,.6); border:1px solid rgba(0,0,0,.05);
}
.sticky-doodle{ font-size:30px; line-height:1; margin-bottom:4px; }
.sticky-doodle-img{ max-width:100%; max-height:60px; object-fit:contain; margin-bottom:4px; }
.sticky-lines{ text-align:left; font-family:var(--font-body); font-size:11px; line-height:1.5; }

.card.type-photostrip{
  display:flex; flex-direction:column; gap:4px; padding:6px 6px 10px; width:76px;
}
.strip-cell{ width:100%; height:42px; border-radius:2px; overflow:hidden; }
.strip-cell img{ width:100%; height:100%; object-fit:cover; display:block; }

.card.type-receipt{
  width:132px; padding:12px 12px 10px; background:#fff; text-align:center;
}
.receipt-title{ font-family:var(--font-body); font-weight:800; font-size:13px; letter-spacing:.02em; }
.receipt-sub{ font-family:var(--font-body); font-size:7.5px; color:var(--gray-700); margin-bottom:6px; }
.receipt-line{ font-family:monospace; font-size:7.5px; text-align:left; color:var(--gray-900); line-height:1.6; }

.card.type-polaroid{ background:#fff; padding:8px 8px 22px; width:100px; }
.polaroid-photo{ width:84px; height:68px; border-radius:2px; margin-bottom:6px; overflow:hidden; }
.polaroid-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.polaroid-caption{ font-family:var(--font-hand); font-size:15px; text-align:center; }
.fragment.tappable{ pointer-events:auto; cursor:grab; }
.fragment.tappable .card{ transition:box-shadow 200ms ease; }
.fragment.dragging{ cursor:grabbing; }
.fragment.dragging .card{
  cursor:grabbing;
  box-shadow:0 16px 28px rgba(0,0,0,.16) !important;
}

#focus-backdrop{
  position:fixed; inset:0; z-index:40;
  background:rgba(20,18,16,0);
  opacity:0; pointer-events:none;
  transition:opacity 350ms ease, background 350ms ease;
}
#focus-backdrop.active{ opacity:1; background:rgba(20,18,16,.45); pointer-events:auto; }
#focus-card{
  position:fixed; z-index:41;
  background:transparent;
  opacity:0; pointer-events:none; cursor:pointer;
  transition:left 420ms cubic-bezier(.2,.8,.2,1), top 420ms cubic-bezier(.2,.8,.2,1),
             opacity 200ms ease;
}
#focus-card.active{ opacity:1; pointer-events:auto; }
#focus-card > *{
  position:static !important;
  margin:0 !important;
  pointer-events:none;
}

#hint{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  font-size:14px; color:var(--gray-700);
  opacity:0; transition:opacity 500ms ease;
  z-index:20; text-align:center;
  background:rgba(255,255,255,.82);
  min-height:40px; padding:10px 18px; border-radius:20px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  max-width:88vw;
}

#hint svg{ flex-shrink:0; }
#hint-text{
  min-width:0;
  white-space:normal;
  overflow-wrap:break-word;
}

#hint.muted{ font-size:13px; background:rgba(255,255,255,.68); }

#breathe-wrap{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:20; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 500ms ease;
}
.breathe-ring{
  position:absolute; border-radius:50%;
  border:2px solid var(--turquoise-2);
  transform:scale(0.82); opacity:.15;
  box-shadow:0 0 0px rgba(0,196,179,0);
  transition:transform 6s cubic-bezier(.45,0,.55,1), opacity 6s cubic-bezier(.45,0,.55,1),
             box-shadow 6s cubic-bezier(.45,0,.55,1), border-color 1s ease;
}
#breathe-ring-1{ width:108px; height:108px; border-color:var(--turquoise-1); border-width:2.5px; }
#breathe-ring-2{ width:140px; height:140px; }
#breathe-ring-3{ width:174px; height:174px; }
#breathe-ring-4{ width:208px; height:208px; }
#breathe-core{
  position:relative; z-index:1;
  width:120px; height:120px; border-radius:50%;
  background:rgba(0,196,179,.55); color:var(--white);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; box-shadow:0 8px 20px rgba(0,196,179,.28);
  backdrop-filter:blur(4px);
}
#breathe-label{ font-size:18px; font-weight:700; line-height:1.2; }

#breathe-core{ transition: background 1s ease; }
#breathe-wrap.exhale-phase #breathe-core{ background: rgba(31,119,223,.55); }
#breathe-wrap.exhale-phase .breathe-ring{ border-color: var(--blue-1); }


#continue-btn{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  z-index:21; opacity:0; transition:opacity 600ms ease;
  pointer-events:none;
  height:40px; padding:0 24px;
  display:flex; align-items:center; justify-content:center;
}

#progress-track{
  position:absolute; top:24px; left:50%; transform:translateX(-50%);
  width:120px; height:4px; border-radius:4px; background:var(--gray-200);
  overflow:hidden; z-index:20;
}
#progress-fill{ height:100%; width:0%; background:var(--turquoise-1); transition:width 60ms linear; }

#screen-close{ background:linear-gradient(180deg,var(--gray-100) 0%, var(--turquoise-3) 100%); }
#screen-close .reveal{ opacity:0; transform:translateY(10px); }
#screen-close.in .reveal{
  animation:reveal-up .8s ease forwards;
}
#screen-close.in .reveal.r1{ animation-delay:.1s; }
#screen-close.in .reveal.r2{ animation-delay:1.1s; }
#screen-close.in .reveal.r3{ animation-delay:2.0s; }
#screen-close.in .reveal.r4{ animation-delay:2.9s; }
#screen-close.in .reveal.r5{ animation-delay:3.7s; }
@keyframes reveal-up{
  to{ opacity:1; transform:translateY(0); }
}
.quote{
  font-family:var(--font-hand);
  font-size:clamp(20px,3.4vw,28px);
  color:var(--gray-900);
  max-width:480px;
  margin:4px 0 10px;
}
.quote-support{
  font-family:var(--font-body);
  font-size:14px;
  color:var(--gray-700);
  max-width:380px;
  margin:0 0 14px;
  line-height:1.45;
}
.next-step{
  font-size:14px; color:var(--gray-700);
  max-width:360px; margin-bottom:26px;
}

.sr-only{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap;
}

@media (prefers-reduced-motion:reduce){
  .mooca.breathe{ animation:none; }
  .screen{ transition:opacity 200ms linear; }
  #mini-mooca{ animation:none; }
  #thought-text.noticing{ animation:none; }
  #screen-close.in .reveal{ animation-duration:.01ms; animation-delay:0ms; }
  .fog-layer{ transition:opacity 200ms linear !important; transform:none !important; filter:none !important; }
  #hint svg{ animation:none; }
  #breathe-ring-1, #breathe-ring-2, #breathe-ring-3, #breathe-ring-4{
    transition:opacity 200ms linear !important; transform:none !important; box-shadow:none !important;
  }
}

@media (max-width:480px){
  #progress-track{ width:90px; }
  .card{ font-size:12px; width:118px; padding:7px 9px; }
  .card.type-sticky{ width:88px; }
  .card.type-photostrip{ width:58px; }
  .card.type-receipt{ width:100px; }
  .card.type-polaroid{ width:76px; }
  .polaroid-photo{ width:60px; height:48px; }
  .receipt-line, .receipt-sub{ font-size:6.5px; }
  #hint{ font-size:12.5px; max-width:82vw; padding:9px 14px; }
}
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

// data/fragments.js
function assignPositions(list, { cols = 7, rows = 6, marginX = 4, marginY = 6 } = {}) {
  const cellW = (100 - marginX * 2) / cols;
  const cellH = (100 - marginY * 2) / rows;
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c });
  for (let i = cells.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }
  return list.map((f, i) => {
    const cell = cells[i % cells.length];
    const jitterX = (Math.random() - 0.5) * cellW * 0.6;
    const jitterY = (Math.random() - 0.5) * cellH * 0.6;
    const top = Math.round((marginY + cell.r * cellH + cellH / 2 + jitterY) * 10) / 10;
    const left = Math.round((marginX + cell.c * cellW + cellW / 2 + jitterX) * 10) / 10;
    const rot = Math.round((Math.random() - 0.5) * 14);
    return { ...f, top, left, rot };
  });
}


function assignTimings(list, { start = 0.25, end = 0.85 } = {}) {
  const n = list.length;
  return list.map((f, idx) => {
    const t = n <= 1 ? start : start + (idx / (n - 1)) * (end - start);
    const jitter = (Math.random() - 0.5) * 0.02;
    return { ...f, at: Math.round((t + jitter) * 1000) / 1000 };
  });
}

const fragments = assignPositions(assignTimings([
  { type: 'photostrip', backing: '#5b6b4a', c1: '#c9c3ba', c2: '#a9a49c', c3: '#c2bcb2', c4: '#aba6a0' },
  { type: 'photostrip', backing: '#d9b8d1', c1: '#33475c', c2: '#3c5268', c3: '#39506a', c4: '#2f4356' },
  { type: 'sticky', text: 'My favorite drawing' },
  { type: 'bubble', text: "I tried bowling for the first time!", tone: 'blue' },
  { type: 'bubble', text: 'that was actually really fun' },
  { type: 'sticky', doodle: '🐱' },
  { type: 'bubble', text: 'am I running out of time?', tone: 'blue' },
  { type: 'sticky', lines: ['To do list:', 'nothing'] },
  { type: 'sticky', doodle: '💪', text: 'GYM' },
  { type: 'bubble', text: 'I laughed so hard!', tone: 'blue' },
  { type: 'sticky', text: 'Maybe tomorrow' },
  { type: 'bubble', text: 'do they actually like me?' },
  { type: 'polaroid', photoColor: '#cbb98a', text: 'Congrats!' },
  { type: 'bubble', text: "I should've taken more pictures.", tone: 'blue' },
  { type: 'bubble', text: "There are places I'll probably never see again." },
  { type: 'bubble', text: "Why does that song still feel like a person?", tone: 'blue' },
  { type: 'bubble', text: "Some days disappear so quietly." },
  { type: 'sticky', lines: ['IDEA??', '↓', 'make it smaller', '↓', 'actually no', '↓', '<strong>MAKE IT BIGGER</strong>'] },
  { type: 'sticky', lines: ["DON'T FORGET", "the thing", "you were", "supposed to", "remember", "oops–"] },
  { type: 'sticky', lines: ['Tiny to-do list', '☐ charge headphones', '☐ water plant', '☐ find that charger', '☐ ???'] },

  { type: 'bubble', text: "did I lock the door?", tone: 'blue' },
  { type: 'bubble', text: "that email can wait until tomorrow" },
  { type: 'bubble', text: "I actually like this song", tone: 'blue' },
  { type: 'bubble', text: "need to text him back" },
  { type: 'bubble', text: "that was a good day, actually", tone: 'blue' },
  { type: 'bubble', text: "should probably drink more water" },

{ type: 'photostrip', backing: '#8a6f52', c1: '#e8d9c3', c2: '#d4c2a5', c3: '#c9b48f', c4: '#e0cfae' },
{ type: 'photostrip', backing: '#3d5a5c', c1: '#a8c4c2', c2: '#8fb0ad', c3: '#b5cfcd', c4: '#96b3b0' },

{ type: 'polaroid', photoColor: '#d8c4a8', text: 'first snow!' },
{ type: 'polaroid', photoColor: '#9db3a8', text: 'the good kind of tired' },
{ type: 'polaroid', photoColor: '#c9a8a1', text: 'miss this place' },

  { type: 'reframe', text: '', isReframeCard: true },
]));

const CHECKPOINTS = [0.25, 0.5, 0.75, 1.0];
const INHALE_MS = 4400;
const EXHALE_MS = 7000;
const BREATH_PAUSE_MS = 900;
const NOTICE_MS = 6500;
const HOLD_BEFORE_CLOSE_MS = 9200;

// hooks/useExperienceEngine.js

function lerp(a, b, t) { return a + (b - a) * t; }

function useExperienceEngine(refs, fragmentsData, { onFinish }) {
  useEffect(() => {
    const {
      world, thoughtOuter, thoughtText, reframeText, experienceScreen,
      hint, hintText, breatheWrap, breatheLabel, breatheRings,
      fogLayers, continueBtn, progressFill,
      mini,
      focusBackdrop, focusCard, fragEls,
    } = Object.fromEntries(Object.entries(refs).map(([k, r]) => [k, r.current]));

    let canvasScale = 1, canvasPanX = 0, canvasPanY = 0;

    function updateCanvasTransform() {
      world.style.transform = `translate(${canvasPanX}px, ${canvasPanY}px) scale(${canvasScale})`;
    }
    function resetCanvasTransform() {
      canvasScale = 1; canvasPanX = 0; canvasPanY = 0;
      updateCanvasTransform();
    }

    const fragMeta = fragmentsData.map(f => ({ def: f, currentScale: 1 }));

    let thoughtDragX = 0, thoughtDragY = 0;
    let z = 0, targetZ = 0, noticeDone = false, locked = false, raf = null;
    let stepIndex = 0, isDrifting = false, inBigPicture = false;
    let miniMood = null;
    let breathTimer = null;
    let tweenStart = 0, tweenFromZ = 0, tweenToZ = 0, tweenDuration = EXHALE_MS;
    let organized = false;

    function setMiniMood(mood) {
      if (mood === miniMood) return;
      miniMood = mood;
      mini.querySelectorAll('.mini-mood').forEach(el => {
        el.classList.toggle('active', el.classList.contains('mood-' + mood));
      });
    }

    function updateProgressDots() { progressFill.style.width = (z * 100) + '%'; }
    function showHint() { hint.classList.remove('muted'); hint.style.opacity = '1'; }
    function hideHint() { hint.style.opacity = '0'; }
    function previewHint() {
      hint.classList.add('muted');
      hint.classList.remove('no-icon');
      hintText.textContent = `In a moment, you'll breathe to step back`;
      hint.style.opacity = '1';
    }

    const RING_TARGETS = {
  expand: [
    { scale: 1.14, opacity: .6, glow: '0 0 18px rgba(0,196,179,.55)' },
    { scale: 1.28, opacity: .4, glow: '0 0 14px rgba(0,196,179,.4)' },
    { scale: 1.42, opacity: .24, glow: '0 0 10px rgba(0,196,179,.25)' },
    { scale: 1.56, opacity: .12, glow: '0 0 8px rgba(0,196,179,.15)' },
  ],
  rest: [
    { scale: 0.84, opacity: .22, glow: '0 0 0px rgba(0,196,179,0)' },
    { scale: 0.78, opacity: .14, glow: '0 0 0px rgba(0,196,179,0)' },
    { scale: 0.72, opacity: .08, glow: '0 0 0px rgba(0,196,179,0)' },
    { scale: 0.66, opacity: .04, glow: '0 0 0px rgba(0,196,179,0)' },
  ],
};
    function setRingPhase(expanding, durationMs) {
      const targets = expanding ? RING_TARGETS.expand : RING_TARGETS.rest;
      breatheRings.forEach((ring, i) => {
        ring.style.transitionDelay = (i * 110) + 'ms';
        ring.style.transitionDuration = (durationMs / 1000) + 's';
      });
      void breatheRings[0].offsetWidth;
      requestAnimationFrame(() => {
        breatheRings.forEach((ring, i) => {
          ring.style.transform = `scale(${targets[i].scale})`;
          ring.style.opacity = targets[i].opacity;
          ring.style.boxShadow = targets[i].glow;
        });
      });
    }

    function runBreathCycle() {
      if (locked || stepIndex >= CHECKPOINTS.length) return;
      breatheWrap.style.opacity = '1';
      breatheWrap.classList.remove('exhale-phase');
      breatheLabel.textContent = 'Inhale';
      setRingPhase(true, INHALE_MS);
      clearTimeout(breathTimer);
      breathTimer = setTimeout(() => {
        breatheWrap.classList.add('exhale-phase');
        breatheLabel.textContent = 'Exhale';
        setRingPhase(false, EXHALE_MS);
        beginDrift(EXHALE_MS);
      }, INHALE_MS);
    }
    function scheduleNextBreath() {
      clearTimeout(breathTimer);
      breathTimer = setTimeout(runBreathCycle, BREATH_PAUSE_MS);
    }

    function beginDrift(duration) {
      if (isDrifting || locked) return;
      if (stepIndex >= CHECKPOINTS.length) return;
      isDrifting = true;
      tweenFromZ = z;
      tweenToZ = CHECKPOINTS[stepIndex];
      tweenStart = Date.now();
      tweenDuration = duration || EXHALE_MS;
      const fog = fogLayers[stepIndex];
      if (fog) {
        const s = (tweenDuration / 1000) + 's';
        fog.style.transitionDuration = `${s}, ${s}, ${s}`;
        fog.classList.add('lifted');
      }
    }

    function render() {
      const now = Date.now();
      progressFill.style.width = (z * 100) + '%';

      const fadeProgress = z;
      const scale = lerp(1, 0.05, fadeProgress);
      const tx = lerp(0, -18, z);
      const ty = lerp(0, 8, z);
      const rot = lerp(0, -4, z);
      const idleY = Math.sin(now / 1400) * 3;
      thoughtOuter.style.transform =
        `translate(-50%,-50%) translate(${tx}vw, ${ty}vh) translate(${thoughtDragX}px, ${thoughtDragY + idleY}px) scale(${scale}) rotate(${rot}deg)`;
      thoughtOuter.style.opacity = 1 - fadeProgress;
      thoughtOuter.style.pointerEvents = fadeProgress >= 1 ? 'none' : '';

      reframeText.style.opacity = Math.min(1, Math.max(0, (z - 0.12) / 0.18));

      fragEls.forEach((el, i) => {
        if (!el) return;
        const meta = fragMeta[i];
        const def = meta.def;
        const local = Math.min(1, Math.max(0, (z - def.at) / 0.14));
        el.style.opacity = local;
        const scaleUp = lerp(0.7, 1, local);
        meta.currentScale = scaleUp;
        const swayY = (!organized && local > 0.05) ? Math.sin(now / 2200 + i * 1.7) * 4 * local : 0;
        const swayRot = (!organized && local > 0.05) ? Math.sin(now / 3000 + i) * 1.4 * local : 0;
        const rot = organized ? 0 : (def.rot + swayRot);
        el.style.transform = `translate(-50%,-50%) translate(0px, ${swayY}px) scale(${scaleUp}) rotate(${rot}deg)`;
      });

      const bgFrom = [255, 255, 255];
      const bgTo = [219, 240, 238];
      const mix = bgTo.map((c, i) => Math.round(lerp(bgFrom[i], c, z)));
      experienceScreen.style.setProperty('--experience-bg',
        `radial-gradient(120% 120% at 50% 40%, rgb(${mix.join(',')}) 0%, #F6F6F6 70%)`);
      experienceScreen.style.setProperty('--dot-alpha', Math.min(1, z / 0.5).toFixed(2));

      setMiniMood(z < 0.32 ? 'worried' : z < 0.68 ? 'neutral' : 'happy');

      thoughtText.style.color = z < 0.4
        ? `rgb(${Math.round(lerp(20, 43, z / 0.4))},${Math.round(lerp(16, 43, z / 0.4))},${Math.round(lerp(14, 43, z / 0.4))})`
        : 'var(--gray-900)';
    }

    function tick() {
      if (!locked) {
        if (isDrifting) {
          const t = Math.min(1, (Date.now() - tweenStart) / tweenDuration);
          z = tweenFromZ + (tweenToZ - tweenFromZ) * t;
          if (t >= 1) {
            z = tweenToZ;
            isDrifting = false;
            stepIndex++;
            updateProgressDots();
            if (stepIndex >= CHECKPOINTS.length) {
              breatheWrap.style.opacity = '0';
              enterBigPicture();
            } else {
              scheduleNextBreath();
            }
          }
        }
        render();
      }
      raf = requestAnimationFrame(tick);
    }

    function enterBigPicture() {
      inBigPicture = true;
      hideHint();
      resetCanvasTransform();
      organizeIntoColumns();
      experienceScreen.classList.add('pannable');
      setTimeout(() => {
        fragEls.forEach(el => el && el.classList.add('tappable'));
        hintText.textContent = 'Tap anything to look closer — drag to rearrange, pinch or scroll to explore';
        hint.classList.remove('muted');
        hint.classList.add('no-icon');
        hint.style.opacity = '1';
      }, 1000);
    }

    // Stacks each column using every card's REAL rendered height (not a
    // guessed percentage) — this is what actually prevents overlap, since
    // bubble text wraps to a different number of lines depending on what
    // the user's content happens to be.
    function organizeIntoColumns(){
      const isNarrow = window.innerWidth < 480;
      const typeToGroup = isNarrow
        ? { bubble:'a', sticky:'a', reframe:'a', photostrip:'b', polaroid:'b', receipt:'b' }
        : null;

      const groups = {};
      const order = [];
      fragMeta.forEach((meta, i) => {
        const t = typeToGroup ? typeToGroup[meta.def.type] : meta.def.type;
        if(!groups[t]){ groups[t] = []; order.push(t); }
        groups[t].push(i);
      });

      const numCols = order.length;
      const marginXPercent = isNarrow ? 6 : 10;
      const marginYPx = 24;
      const gapPx = isNarrow ? 14 : 22;
      const colWidthPercent = (100 - marginXPercent*2) / numCols;
      const worldHeight = world.clientHeight || window.innerHeight;

      order.forEach((groupKey, colIdx) => {
        const indices = groups[groupKey];
        const colLeftPercent = marginXPercent + colWidthPercent*colIdx + colWidthPercent/2;
        let runningTopPx = marginYPx;
        indices.forEach((fragIndex) => {
          const el = fragEls[fragIndex];
          if(!el) return;
          const heightPx = el.getBoundingClientRect().height || 60;
          const topPercent = (runningTopPx / worldHeight) * 100;
          el.style.transition = 'top 900ms ease, left 900ms ease';
          el.style.top = topPercent + '%';
          el.style.left = colLeftPercent + '%';
          runningTopPx += heightPx + gapPx;
        });
      });
      organized = true;
      setTimeout(() => {
        fragEls.forEach(el => { if(el) el.style.transition = ''; });
      }, 950);
    }

    function dismissBigPictureHint() {
      if (!inBigPicture) return;
      hideHint();
      continueBtn.style.opacity = '1';
      continueBtn.style.pointerEvents = 'auto';
    }
    function finishExperience() {
      if (locked) return;
      locked = true;
      closeFocus(true);
      onFinish();
    }
    continueBtn.addEventListener('click', finishExperience);

    let focusOriginEl = null, focusOriginRect = null, focusCloneEl = null, focusBaseScale = 1;
    function openFocus(hideEl, styleSourceEl, baseScale) {
      baseScale = baseScale || 1;
      const rect = styleSourceEl.getBoundingClientRect();
      const naturalW = rect.width / baseScale;
      const naturalH = rect.height / baseScale;

      focusOriginEl = hideEl;
      focusOriginRect = rect;
      focusBaseScale = baseScale;

      focusCard.innerHTML = '';
      const clone = styleSourceEl.cloneNode(true);
      clone.removeAttribute('id');
      focusCard.appendChild(clone);
      focusCloneEl = clone;

      Object.assign(focusCard.style, {
        left: rect.left + 'px', top: rect.top + 'px',
        width: naturalW + 'px', height: naturalH + 'px',
      });
      Object.assign(clone.style, {
        transformOrigin: 'top left',
        transform: `scale(${baseScale})`,
        transition: 'none',
      });

      hideEl.style.visibility = 'hidden';
      void focusCard.offsetWidth;
      focusCard.classList.add('active');
      focusBackdrop.classList.add('active');

      requestAnimationFrame(() => {
        const targetScale = Math.min(
          Math.min(420, window.innerWidth * 0.8) / naturalW,
          Math.min(300, window.innerHeight * 0.5) / naturalH,
          3.2
        );
        const targetW = naturalW * targetScale, targetH = naturalH * targetScale;
        focusCard.style.left = ((window.innerWidth - targetW) / 2) + 'px';
        focusCard.style.top = ((window.innerHeight - targetH) / 2) + 'px';
        clone.style.transition = 'transform 420ms cubic-bezier(.2,.8,.2,1)';
        clone.style.transform = `scale(${targetScale})`;
      });
    }
    function closeFocus(instant) {
      if (!focusOriginEl) return;
      if (instant) {
        focusCard.classList.remove('active');
        focusBackdrop.classList.remove('active');
        focusOriginEl.style.visibility = 'visible';
        focusOriginEl = null; focusOriginRect = null; focusCloneEl = null;
        return;
      }
      focusCard.style.left = focusOriginRect.left + 'px';
      focusCard.style.top = focusOriginRect.top + 'px';
      if (focusCloneEl) focusCloneEl.style.transform = `scale(${focusBaseScale})`;
      focusBackdrop.classList.remove('active');
      const origin = focusOriginEl;
      setTimeout(() => {
        focusCard.classList.remove('active');
        origin.style.visibility = 'visible';
      }, 420);
      focusOriginEl = null; focusOriginRect = null; focusCloneEl = null;
    }
    const onBackdropClick = () => closeFocus(false);
    const onFocusCardClick = () => closeFocus(false);
    focusBackdrop.addEventListener('click', onBackdropClick);
    focusCard.addEventListener('click', onFocusCardClick);

    let topZ = 9;
    function bringToFront(el) { topZ += 1; el.style.zIndex = topZ; }

    const dragCleanups = [];
    function wireDraggable(el, cardEl, getBaseScale) {
      let startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = 0, dragging = false;
      const onDown = (e) => {
        if (!inBigPicture || focusOriginEl) return;
        el.setPointerCapture(e.pointerId);
        startX = e.clientX; startY = e.clientY;
        startLeft = el.offsetLeft; startTop = el.offsetTop;
        el.style.left = startLeft + 'px';
        el.style.top = startTop + 'px';
        moved = 0; dragging = true;
        el.classList.add('dragging');
        bringToFront(el);
        dismissBigPictureHint();
      };
      const onMove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        moved = Math.hypot(dx, dy);
        el.style.left = (startLeft + dx) + 'px';
        el.style.top = (startTop + dy) + 'px';
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        if (moved < 6) openFocus(el, cardEl, getBaseScale());
      };
      el.style.touchAction = 'none';
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      dragCleanups.push(() => {
        el.removeEventListener('pointerdown', onDown);
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
      });
    }

    fragEls.forEach((el, i) => {
      if (!el) return;
      const cardEl = el.querySelector('.card');
      wireDraggable(el, cardEl, () => fragMeta[i].currentScale);
    });

    const onWheel = (e) => {
      if (locked || !inBigPicture) return;
      e.preventDefault();
      canvasScale = Math.min(2.2, Math.max(0.6, canvasScale - e.deltaY * 0.0012));
      updateCanvasTransform();
      dismissBigPictureHint();
    };
    experienceScreen.addEventListener('wheel', onWheel, { passive: false });

    let pinchStartDist = null, pinchStartScale = 1;
    const onTouchStart = (e) => {
      if (locked || !inBigPicture) return;
      if (e.touches.length === 2) {
        const [a, b] = e.touches;
        pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        pinchStartScale = canvasScale;
      }
    };
    const onTouchMove = (e) => {
      if (locked || !inBigPicture || pinchStartDist === null) return;
      if (e.touches.length === 2) {
        e.preventDefault();
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        canvasScale = Math.min(2.2, Math.max(0.6, pinchStartScale * (dist / pinchStartDist)));
        updateCanvasTransform();
        dismissBigPictureHint();
      }
    };
    const onTouchEnd = () => { pinchStartDist = null; };
    experienceScreen.addEventListener('touchstart', onTouchStart, { passive: true });
    experienceScreen.addEventListener('touchmove', onTouchMove, { passive: false });
    experienceScreen.addEventListener('touchend', onTouchEnd);

    let panState = null;
    const onPanDown = (e) => {
      if (!inBigPicture || focusOriginEl) return;
      if (e.target.closest('.fragment') || e.target.closest('#thought-wrap') || e.target.closest('button')) return;
      experienceScreen.setPointerCapture(e.pointerId);
      panState = { startX: e.clientX, startY: e.clientY, startPanX: canvasPanX, startPanY: canvasPanY };
      experienceScreen.classList.add('panning');
    };
    const onPanMove = (e) => {
      if (!panState) return;
      canvasPanX = panState.startPanX + (e.clientX - panState.startX);
      canvasPanY = panState.startPanY + (e.clientY - panState.startY);
      updateCanvasTransform();
      dismissBigPictureHint();
    };
    const onPanUp = () => {
      if (panState) { panState = null; experienceScreen.classList.remove('panning'); }
    };
    experienceScreen.addEventListener('pointerdown', onPanDown);
    experienceScreen.addEventListener('pointermove', onPanMove);
    window.addEventListener('pointerup', onPanUp);

    window.__tdJump = (v) => { clearTimeout(breathTimer); clearTimeout(noticeTimerRef); isDrifting = false; z = v; stepIndex = CHECKPOINTS.filter(c => c <= v).length; fogLayers.forEach((f, i) => { if (i < stepIndex) { f.style.transitionDuration = '0s'; f.classList.add('lifted'); } }); hideHint(); breatheWrap.style.opacity = '0'; render(); if (v >= 1) enterBigPicture(); };
    window.__tdBreath = () => { breatheWrap.style.opacity = '1'; breatheLabel.textContent = 'Inhale'; setRingPhase(true, 10); };
    let noticeTimerRef = null;
    hideHint();
    thoughtText.classList.add('noticing');
    tick();
    previewHint();
    const noticeTimer = noticeTimerRef = setTimeout(() => {
      noticeDone = true;
      hideHint();
      runBreathCycle();
    }, 6500);

    return () => {
      cancelAnimationFrame(raf);
      clearTimeout(breathTimer);
      clearTimeout(noticeTimer);
      continueBtn.removeEventListener('click', finishExperience);
      focusBackdrop.removeEventListener('click', onBackdropClick);
      focusCard.removeEventListener('click', onFocusCardClick);
      dragCleanups.forEach(fn => fn());
      experienceScreen.removeEventListener('wheel', onWheel);
      experienceScreen.removeEventListener('touchstart', onTouchStart);
      experienceScreen.removeEventListener('touchmove', onTouchMove);
      experienceScreen.removeEventListener('touchend', onTouchEnd);
      experienceScreen.removeEventListener('pointerdown', onPanDown);
      experienceScreen.removeEventListener('pointermove', onPanMove);
      window.removeEventListener('pointerup', onPanUp);
    };
  }, []);
}

// components/Mascot.jsx
function Mascot({ className = 'mooca', src }) {
  return <img className={className} src={src} alt="" />;
}

function Logo({ className = '' }) {
  return <img className={`logo-mark-img ${className}`} src="assets/logo.png" alt="mindfull" />;
}

// components/MiniMascot.jsx
function MiniMascot({ rootRef }) {
  return (
    <div id="mini-mooca" ref={rootRef}>
      <img className="mini-mood mood-worried" src="assets/Sad.png" alt="" />
      <img className="mini-mood mood-neutral" src="assets/Neutral.png" alt="" />
      <img className="mini-mood mood-happy" src="assets/Happy.png" alt="" />
    </div>
  );
}

// screens/FragmentCard.jsx
function FragmentCard({ f }) {
  const toneClass = f.tone ? ` tone-${f.tone}` : '';

  if (f.type === 'photostrip') {
    const cells = f.images || [f.c1, f.c2, f.c3, f.c4];
    return (
      <div className={`card${toneClass} type-photostrip`} style={{ background: f.backing }}>
        {cells.map((c, i) =>
          f.images ? (
            <div className="strip-cell" key={i}><img src={c} alt="" /></div>
          ) : (
            <div className="strip-cell" key={i} style={{ background: c }} />
          )
        )}
      </div>
    );
  }

  if (f.type === 'receipt') {
    return (
      <div className={`card${toneClass} type-receipt`}>
        <div className="receipt-title">RECEIPTIFY</div>
        <div className="receipt-sub">LAST 6 MONTHS</div>
        {(f.lines || []).map((l, i) => (
          <div className="receipt-line" key={i}>{l}</div>
        ))}
      </div>
    );
  }

  if (f.type === 'sticky') {
    return (
      <div className={`card${toneClass} type-sticky`}>
        <div className="sticky-tape" />
        {f.img && <img className="sticky-doodle-img" src={f.img} alt="" />}
        {!f.img && f.doodle && <div className="sticky-doodle">{f.doodle}</div>}
        {f.lines ? (
          <div className="sticky-lines" dangerouslySetInnerHTML={{ __html: f.lines.join('<br>') }} />
        ) : f.text ? (
          <div>{f.text}</div>
        ) : null}
      </div>
    );
  }

  if (f.type === 'polaroid') {
    return (
      <div className={`card${toneClass} type-polaroid`}>
        <div className="polaroid-photo">
          {f.photoSrc ? <img src={f.photoSrc} alt="" /> : <div style={{ width: '100%', height: '100%', background: f.photoColor }} />}
        </div>
        <div className="polaroid-caption">{f.text}</div>
      </div>
    );
  }

  if (f.type === 'reframe') {
    return (
      <div className={`card${toneClass} type-reframe`}>
        <div className="reframe-prefix">I'm having the thought that…</div>
        <div className="reframe-main">{f.text}</div>
      </div>
    );
  }

  return <div className={`card${toneClass} type-bubble`}>{f.text}</div>;
}

const CHIPS = ["I'm falling behind.", "I can't handle this.", "I'm not good enough."];

function InputScreen({ onContinue }) {
  const [value, setValue] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current?.focus();
  }, []);

  function handleContinue() {
    onContinue((value || "I'm falling behind.").trim());
  }

  return (
    <section className="screen active" id="screen-input">
      <p className="eyebrow">01 • Put the thought outside</p>
      <h1 className="prompt">Is there a thought that's been weighing on you?</h1>
      <input
        ref={inputRef}
        type="text"
        className="thought-input"
        id="thought-field"
        maxLength={60}
        placeholder="Type it here…"
        aria-label="Type the thought that's on your mind"
        value={value}
        onChange={e => setValue(e.target.value)}
      />
      <div className="chip-row" id="chip-row">
        {CHIPS.map(c => (
          <button key={c} className="chip" onClick={() => setValue(c)}>{c}</button>
        ))}
      </div>
      <button className="btn" id="btn-continue" onClick={handleContinue}>Continue</button>
    </section>
  );
}

// screens/Experience.jsx

function Experience({ thought, onFinish }) {
  const liveFragments = fragments.map(f => (f.isReframeCard ? { ...f, text: thought } : f));

  const world = useRef(null);
  const thoughtOuter = useRef(null);
  const thoughtText = useRef(null);
  const reframeText = useRef(null);
  const experienceScreen = useRef(null);
  const hint = useRef(null);
  const hintText = useRef(null);
  const breatheWrap = useRef(null);
  const breatheLabel = useRef(null);
  const progressFill = useRef(null);
  const mini = useRef(null);
  const focusBackdrop = useRef(null);
  const focusCard = useRef(null);
  const continueBtn = useRef(null);

  const breatheRings = useRef([]);
  const fogLayers = useRef([]);
  const fragEls = useRef([]);

  useExperienceEngine(
    {
      world, thoughtOuter, thoughtText, reframeText, experienceScreen,
      hint, hintText, breatheWrap, breatheLabel, breatheRings,
      fogLayers, continueBtn, progressFill,
      mini,
      focusBackdrop, focusCard, fragEls,
    },
    liveFragments,
    { onFinish }
  );

  return (
    <section className="screen active" id="screen-experience" ref={experienceScreen}>


      {[0, 1, 2].map(i => (
        <div key={i} id={`fog-${i + 1}`} className="fog-layer" ref={el => (fogLayers.current[i] = el)} />
      ))}

      <div id="progress-track" aria-hidden="true">
        <div id="progress-fill" ref={progressFill} />
      </div>

      <div id="world" ref={world}>
        <div id="thought-wrap" ref={thoughtOuter}>
          <div id="thought-card-inner">
            <div id="reframe-text" ref={reframeText}>I'm having the thought that…</div>
            <div id="thought-text" ref={thoughtText}>{thought}</div>
          </div>
        </div>

        {liveFragments.map((f, i) => (
          <div
            key={i}
            className={`fragment${f.tone ? ' tone-' + f.tone : ''}`}
            style={{ top: f.top + '%', left: f.left + '%' }}
            ref={el => (fragEls.current[i] = el)}
          >
            <FragmentCard f={f} />
          </div>
        ))}
      </div>

      <MiniMascot rootRef={mini} />

      <div id="hint" ref={hint}>
        <span id="hint-text" ref={hintText}>In a moment, you'll be able to breathe to step back</span>
      </div>

      <div id="breathe-wrap" ref={breatheWrap}>
        {[4, 3, 2, 1].map(n => (
          <div key={n} id={`breathe-ring-${n}`} className="breathe-ring" ref={el => (breatheRings.current[n - 1] = el)} />
        ))}
        <div id="breathe-core">
          <span id="breathe-label" ref={breatheLabel}>Inhale</span>
        </div>
      </div>

      <button id="continue-btn" className="btn secondary" ref={continueBtn}>Continue</button>
      <div id="focus-backdrop" ref={focusBackdrop} />
      <div id="focus-card" ref={focusCard} />
    </section>
  );
}

// screens/Close.jsx

function Close({ onRestart }) {
  const [revealed, setRevealed] = useState(false);
  useEffect(() => {
    const id = requestAnimationFrame(() => setRevealed(true));
    return () => cancelAnimationFrame(id);
  }, []);

  return (
    <section className={`screen active${revealed ? ' in' : ''}`} id="screen-close">
      <Mascot className="mooca reveal r1" src="assets/lastscreen.png" />
      <Logo className="reveal r1" />
      <p className="quote reveal r2">"This thought is part of your story. It is not your whole story."</p>
      <p className="quote-support reveal r3">A thought can feel like everything when you're standing too close to it. Sometimes, stepping back helps you see what was there all along.</p>
      <p className="next-step reveal r4">You can carry the thought without letting it define everything.</p>
      <button className="btn secondary reveal r5" id="btn-restart" onClick={onRestart}>Start over</button>
    </section>
  );
}

// App.jsx

function App() {
  const [screen, setScreen] = useState('entry');
  const [thought, setThought] = useState('');
  const [timerRunning, setTimerRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const startRef = useRef(null);
  const intervalRef = useRef(null);

  function handleBegin() {
    setScreen('input');
    startRef.current = Date.now();
    setElapsed(0);
    setTimerRunning(true);
    clearInterval(intervalRef.current);
    intervalRef.current = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startRef.current) / 1000));
    }, 250);
  }

  function handleContinue(text) {
    setThought(text);
    setScreen('experience');
  }

  function handleFinish() {
    setScreen('close');
    setTimerRunning(false);
    clearInterval(intervalRef.current);
  }

  function handleRestart() {
    setThought('');
    setScreen('entry');
    setTimerRunning(false);
    clearInterval(intervalRef.current);
  }

  useEffect(() => () => clearInterval(intervalRef.current), []);

  const mm = Math.floor(elapsed / 60);
  const ss = String(elapsed % 60).padStart(2, '0');

  return (
    <div id="app">
      {screen === 'entry' && <Entry onBegin={handleBegin} />}
      {screen === 'input' && <InputScreen onContinue={handleContinue} />}
      {screen === 'experience' && (
        <Experience thought={thought} onFinish={handleFinish} />
      )}
      {screen === 'close' && <Close onRestart={handleRestart} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
